{% extends "base.html" %}
{% block title %}Статус задачи{% endblock %}
{% block content %}
<div class="card">
  <h1>Обработка запроса</h1>
  <p><b>Запрос:</b> {{ job.query }}</p>
  <p><b>Статус:</b> <span id="status" class="pill">{{ job.status }}</span></p>

  <div class="progress" aria-hidden="true">
    <div id="progress-bar" class="progress-bar"
         style="width: {{ (job.progress * 100)|round(0, 'floor') }}%;"></div>
  </div>
  <p style="margin-top:6px;display:flex;justify-content:space-between;gap:12px;">
    <span id="stage" class="muted">{{ job.stage }}</span>
    <span id="pct" class="muted">{{ (job.progress * 100)|round(0, 'floor')|int }}%</span>
  </p>

  <p id="message" class="muted">{{ job.message }}</p>
  <div id="result"></div>
</div>

<style>
  .progress {
    margin-top: 14px;
    width: 100%;
    height: 14px;
    background: #eceef1;
    border-radius: 8px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #6366f1);
    background-size: 200% 100%;
    border-radius: 8px;
    /* Плавное перетекание при собственном «подкрадывании» прогресса. */
    transition: width .25s linear;
    animation: barflow 2s linear infinite;
  }
  .progress-bar.error {
    background: #ef4444;
    animation: none;
  }
  .progress-bar.done { animation: none; }
  @keyframes barflow {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  #pct { font-variant-numeric: tabular-nums; }
</style>

<script>
const jobId = "{{ job.id }}";
const statusEl = document.getElementById("status");
const msgEl = document.getElementById("message");
const stageEl = document.getElementById("stage");
const pctEl = document.getElementById("pct");
const barEl = document.getElementById("progress-bar");
const resultEl = document.getElementById("result");

// Псевдо-прогресс: bar плавно «подкрадывается» к target между опросами сервера,
// поэтому даже на долгих этапах полоса не выглядит застывшей. shown никогда
// не убывает и не перескакивает 100% до реального done.
let shown = {{ (job.progress * 100)|round(2) }};   // текущее показанное, %
let target = shown;                                  // куда стремимся, %
let finished = false;

function setBar(p) {
  p = Math.max(0, Math.min(100, p));
  barEl.style.width = p.toFixed(1) + "%";
  pctEl.textContent = Math.round(p) + "%";
}

// Кадр анимации: приближаем shown к target с затуханием (быстро -> медленно).
function tick() {
  if (finished) return;
  // Пока ждём следующий этап, потолок ползёт чуть выше текущего target,
  // но не выше 95%, чтобы «не упереться» и не обмануть на 100%.
  const ceil = Math.min(95, target + 6);
  if (shown < ceil) {
    const gap = ceil - shown;
    shown += Math.max(0.06, gap * 0.012);   // затухающее приближение
    if (shown > ceil) shown = ceil;
    setBar(shown);
  }
  requestAnimationFrame(tick);
}

function renderDone(reportId) {
  finished = true;
  barEl.classList.add("done");
  setBar(100);
  stageEl.textContent = "Готово";
  resultEl.innerHTML =
    `<p style="margin-top:14px;"><a class="btn" href="/reports/${reportId}/view" target="_blank">Открыть отчёт</a> ` +
    `&nbsp;<a class="btn-ghost" href="/reports/${reportId}/download">Скачать</a></p>`;
}

async function poll() {
  try {
    const r = await fetch(`/run/${jobId}/state`);
    if (!r.ok) { setTimeout(poll, 3000); return; }
    const j = await r.json();
    statusEl.textContent = j.status;
    msgEl.textContent = j.message || "";
    if (typeof j.progress === "number") {
      // target только растёт: реальные этапы двигают полосу вперёд.
      target = Math.max(target, j.progress * 100);
    }
    if (j.stage) stageEl.textContent = j.stage;
    if (j.status === "done" && j.report_id) {
      renderDone(j.report_id);
      return;
    }
    if (j.status === "error") {
      finished = true;
      barEl.classList.add("error");
      setBar(100);
      return;
    }
    setTimeout(poll, 2000);
  } catch (e) {
    setTimeout(poll, 5000);
  }
}

{% if job.status in ("queued", "running") %}
setBar(shown);
requestAnimationFrame(tick);
poll();
{% endif %}
{% if job.status == "done" and job.report_id %}renderDone({{ job.report_id }});{% endif %}
{% if job.status == "error" %}finished = true; barEl.classList.add("error"); setBar(100);{% endif %}
</script>
{% endblock %}
